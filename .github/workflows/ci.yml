name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-sast:
    name: Tests and SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Unit tests and SpotBugs with FindSecBugs
        run: ./mvnw -B verify
      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: |
            target/spotbugsXml.xml
            target/reports/spotbugs.html
          if-no-files-found: ignore

  sca:
    name: SCA Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Cache OWASP Dependency-Check data
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-v13
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-
      - name: OWASP Dependency-Check
        run: ./mvnw -B -Psca verify -DskipTests -Dspotbugs.skip=true -DdataDirectory=$HOME/.dependency-check-data
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          if-no-files-found: ignore
